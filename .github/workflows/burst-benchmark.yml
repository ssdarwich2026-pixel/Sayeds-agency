# burst-benchmark.yml - placed live in Sayeds-agency 2026-10-30 for the
# burst-readiness run (Sayed order). Source pack:
# fleet/expansion-bot/burst-actions-workflow.yml (identical except this
# header). The benchmark script lives at tools/burst-benchmark.py,
# exactly where the run steps below look for it.
# It runs the IDENTICAL representative workload as the VM baseline
# (burst-benchmark.py: SHA-256 + zlib-6 on a deterministic 5 MB chunk)
# in parallel matrix jobs, then a summary job totals tasks/min.
#
# Exact runner spec (GitHub-hosted standard runner, ubuntu-latest,
# documented by GitHub for standard runners - PREPARED from docs,
# NOT verified by a live run in this prep):
#   Linux: 4 vCPU, 16 GB RAM, 14 GB SSD, x64, ephemeral (fresh VM per job)
# Honest limits:
#   - Public repos: standard runners are free with fair-use limits;
#     private repos consume the account's included Actions minutes.
#   - Max 256 jobs per matrix per workflow run; per-job limit 6 hours;
#     queue/startup time is real and NOT counted in tasks/min.
#   - No GPU on standard runners. No persistence between jobs/runs
#     (artifacts only). Concurrency can be throttled by GitHub.
#   - 4 shards x 16 GB = 64 GB of *ephemeral* RAM across 4 machines -
#     it is NOT pooled RAM and cannot run one 64 GB job.
name: burst-benchmark

# Note 2026-10-30: the trigger key is quoted ("on") so strict YAML 1.1
# parsers do not read it as boolean True. GitHub accepts both forms.
"on":
  workflow_dispatch:
    inputs:
      iterations:
        description: "Iterations per shard (baseline uses 20)"
        default: "20"

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run identical burst workload (shard ${{ matrix.shard }})
        run: |
          python3 tools/burst-benchmark.py \
            --iterations "${{ inputs.iterations }}" \
            --chunk-mb 5 \
            --shard ${{ matrix.shard }} \
            --out "burst-result-shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: burst-result-shard-${{ matrix.shard }}
          path: burst-result-shard-${{ matrix.shard }}.json

  summary:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Total the shards (compare against the VM baseline file)
        run: |
          python3 - <<'PY'
          import glob, json
          total_tpm = 0.0
          for f in sorted(glob.glob("burst-result-shard-*.json")):
              d = json.load(open(f))
              tpm = d["results"]["tasks_per_min"]
              print(f, "tasks_per_min:", tpm,
                    "| host cpus:", d["host"]["cpu_count_logical"],
                    "| mem_total_mb:", d["host"]["mem_total_mb"])
              total_tpm += tpm
          print("BURST TOTAL tasks_per_min (sum of 4 shards):", round(total_tpm, 2))
          print("VM BASELINE tasks_per_min: 292.03 (2026-10-29, see "
                "burst-benchmark-baseline-2026-10-29.json)")
          print("Claim rule: burst equivalence is only defensible for THIS "
                "workload, while the runners are actually running.")
          PY
