# Agency poller — asks GroupMe "anything new?" every 5 minutes and replies as the bot.
# Secrets required (repo Settings → Secrets and variables → Actions):
#   GROUPME_USER_TOKEN — your GroupMe access token (the ears: reads groups)
#   GROUPS_JSON        — {"<group_id>": "<bot_id>", ...}  (group_id = number in the web.groupme.com URL)
#
# State (poll-state.json) persists between runs via the Actions cache, not git:
# the old "commit state" step failed on the runner and caused re-answers.
# Cache keys are per-run; restore falls back to the newest poll-state-* entry.

name: GroupMe Poll

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:  # manual "Run workflow" button for testing

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore poll state
        uses: actions/cache/restore@v4
        with:
          path: integrations/groupme-bot/data/poll-state.json
          key: poll-state-cache
          restore-keys: |
            poll-state-

      - name: Poll GroupMe groups
        env:
          GROUPME_USER_TOKEN: ${{ secrets.GROUPME_USER_TOKEN }}
          GROUPS_JSON: ${{ secrets.GROUPS_JSON }}
        working-directory: integrations/groupme-bot
        run: python3 poll_once.py

      - name: Save poll state
        uses: actions/cache/save@v4
        with:
          path: integrations/groupme-bot/data/poll-state.json
          key: poll-state-${{ github.run_id }}-${{ github.run_attempt }}
