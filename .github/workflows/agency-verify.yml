name: agency-verify

# Deterministic agency verification. No LLMs, no CrewAI, no API keys, $0.
# Runs the checks a human reviewer would run: secrets, tests, manifest, images.
# ChatGPT creates tasks -> Muse builds -> this workflow verifies.

on:
  push:
  schedule:
    - cron: '0 13 * * *'   # daily 13:00 UTC
  workflow_dispatch:
  issues:
    types: [opened]        # ChatGPT opens an issue containing "verify" -> checks run, result posted back

permissions:
  contents: read   # verify only; never commits
  issues: write    # post result comment on the triggering issue only

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Gate issue trigger
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$EVENT" = "issues" ]; then
            if printf '%s\n%s' "$ISSUE_TITLE" "$ISSUE_BODY" | grep -qi "verify"; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "comment=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "comment=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "comment=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install pillow

      - name: Check artwork presence
        id: art
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -d "foxwatch/artwork" ] && [ -n "$(ls -A foxwatch/artwork 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "artwork not in git (binaries excluded by repo policy) - artwork checks will skip"
          fi

      - name: Secret scan (fail on leaked key material)
        id: secrets
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 - << 'EOF'
          import os, re, sys
          root = os.getcwd()
          fails = []
          # built from parts so this file itself never matches the scan
          key_block = re.compile('-----BEGIN ' + '.*PRIVATE KEY-----')
          api_assign = re.compile(r'(?i)(api[_-]?key|secret[_-]?key|private[_-]?key)\s*[:=]\s*[\'"][^\'"]{8,}[\'"]')
          for dirpath, dirnames, filenames in os.walk(root):
              if '.git' in dirpath.split(os.sep):
                  continue
              for fn in filenames:
                  # the scanner always excludes itself
                  if fn == 'agency-verify.yml':
                      continue
                  p = os.path.join(dirpath, fn)
                  try:
                      with open(p, 'r', errors='strict') as f:
                          text = f.read()
                  except Exception:
                      continue  # binary, skip
                  if key_block.search(text):
                      fails.append(f"{p}: private key block")
                  if not fn.endswith('.md') and api_assign.search(text):
                      fails.append(f"{p}: possible hardcoded API/secret key")
          if fails:
              print("SECRET SCAN FAILED:"); [print(" -", x) for x in fails]; sys.exit(1)
          print("secret scan: clean")
          EOF

      - name: Run Foxwatch test suite
        id: tests
        if: steps.gate.outputs.run == 'true'
        run: python foxwatch/pipeline/test_pipeline.py

      - name: Validate catalog manifest
        id: manifest
        if: steps.gate.outputs.run == 'true' && steps.art.outputs.present == 'true'
        run: >
          python foxwatch/pipeline/foxwatch_pipeline.py
          --art-dir foxwatch/artwork
          --metadata foxwatch/metadata/foxwatch-batch2-metadata.json
          --out-dir /tmp/fw-out
        # pipeline exits 1 on blocking errors -> fails the job

      - name: Image integrity check
        id: images
        if: steps.gate.outputs.run == 'true' && steps.art.outputs.present == 'true'
        run: |
          python3 - << 'EOF'
          import os, sys, hashlib
          from PIL import Image
          art = 'foxwatch/artwork'
          files = sorted(f for f in os.listdir(art) if f.lower().endswith('.png'))
          seen, bad = set(), []
          for fn in files:
              p = os.path.join(art, fn)
              try:
                  with Image.open(p) as im:
                      im.verify()
                  h = hashlib.sha256(open(p, 'rb').read()).hexdigest()
                  if h in seen:
                      bad.append(f"{fn}: byte-duplicate")
                  seen.add(h)
              except Exception as e:
                  bad.append(f"{fn}: unreadable ({e})")
          print(f"images: {len(files)} checked, {len(bad)} problems")
          if bad:
              [print(" -", b) for b in bad]; sys.exit(1)
          if len(files) < 53:
              print(f"WARNING: only {len(files)} images (expected 53)")
          print("image integrity: clean")
          EOF

      - name: Summary
        if: steps.gate.outputs.run == 'true'
        run: 'echo "agency-verify OK - secrets clean, tests pass, manifest valid, images intact"'

      - name: Report result to issue
        if: always() && steps.gate.outputs.comment == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          S_SECRETS: ${{ steps.secrets.outcome }}
          S_TESTS: ${{ steps.tests.outcome }}
          S_MANIFEST: ${{ steps.manifest.outcome }}
          S_IMAGES: ${{ steps.images.outcome }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            LINE="PASS - all checks green"
          else
            LINE="FAIL - secrets:$S_SECRETS tests:$S_TESTS manifest:$S_MANIFEST images:$S_IMAGES"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "## agency-verify: $LINE
          Commit: $SHA
          Run log: $RUN_URL"
