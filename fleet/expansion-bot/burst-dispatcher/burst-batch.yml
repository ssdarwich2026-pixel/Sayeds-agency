# burst-batch.yml - queue-driven burst dispatcher, workflow v2.
# Placed live in Sayeds-agency 2026-10-30 (Sayed order: build the
# queue-driven burst dispatcher). Source pack:
# fleet/expansion-bot/burst-dispatcher/.
#
# How it works: pack_batch.py (dispatcher side) packs pending queue
# jobs into a batch manifest committed at batches/<batch-id>.json.
# A human dispatches this workflow with that batch_id. The setup job
# reads the manifest and emits a dynamic matrix of job indices; each
# shard runs tools/burst_runner.py for ONE job and uploads its
# result JSON (+ any files under burst_out/<job-id>/); the summary
# job totals the results into a batch-summary artifact. Results are
# then read back dispatcher-side by ingest_results.py, which is what
# closes jobs in the checkpoint - never the workflow itself.
#
# Fair use, on purpose: this workflow runs the repo's own real work
# in human-dispatched batches. It is NOT on a schedule and must never
# be put on a timer loop - empty/looped runs would be abuse of the
# free runners and would risk the account the fleet's code lives in.
# Limits: max 256 matrix jobs per run (we pack <= 20 by default),
# 6 h per job, free-account concurrency caps queue extra runs,
# ephemeral runners (artifacts are the only output), no GPU.
#
# Hardening 2026-10-30 (code-review adjudication, patches P2/P3/P6/
# P11): dispatch inputs travel via env: and are regex-validated,
# never interpolated into shell/Python; the summary RECONCILES the
# reported index set against the setup count and exits 1 on any
# mismatch or per-item error (the artifact no longer reads green
# over a hole - ingest_results.py remains the system of record);
# uploads fail loud when no files are found; Pillow is pinned and
# installed only for batches that contain image_convert jobs; a
# per-batch concurrency group stops double-dispatch waste.
name: burst-batch

"on":
  workflow_dispatch:
    inputs:
      batch_id:
        description: "Batch manifest id, e.g. batch-20261030-001 (file: batches/<batch_id>.json)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: burst-batch-${{ inputs.batch_id }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      indices: ${{ steps.manifest.outputs.indices }}
      count: ${{ steps.manifest.outputs.count }}
      needs_pillow: ${{ steps.manifest.outputs.needs_pillow }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: manifest
        name: Read batch manifest, emit job-index matrix
        env:
          BATCH_ID: ${{ inputs.batch_id }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "tools")
          from burst_runner import validate_manifest
          bid = os.environ["BATCH_ID"]
          m = json.load(open(f"batches/{bid}.json"))
          validate_manifest(m)
          if m["batch_id"] != bid:
              raise SystemExit(f"manifest batch_id mismatch: {m['batch_id']} != {bid}")
          idx = list(range(len(m["jobs"])))
          needs_pillow = any(j["type"] == "image_convert" for j in m["jobs"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"indices={json.dumps(idx)}\n")
              f.write(f"count={len(idx)}\n")
              f.write(f"needs_pillow={str(needs_pillow).lower()}\n")
          print(f"batch {bid}: {len(idx)} jobs -> indices {idx}")
          PY

  run:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.setup.outputs.indices) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Pillow (image_convert jobs only)
        if: needs.setup.outputs.needs_pillow == 'true'
        run: pip install --quiet "Pillow==11.0.0"
      - name: Run one queued job
        env:
          BATCH_ID: ${{ inputs.batch_id }}
          JOB_INDEX: ${{ matrix.index }}
        run: |
          python3 tools/burst_runner.py \
            --manifest "batches/${BATCH_ID}.json" \
            --index "${JOB_INDEX}" \
            --out "burst-result-${JOB_INDEX}.json" \
            --workdir .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: burst-job-${{ inputs.batch_id }}-${{ matrix.index }}
          path: |
            burst-result-${{ matrix.index }}.json
            burst_out/
          if-no-files-found: error
          retention-days: 30

  summary:
    needs: [setup, run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: burst-job-${{ inputs.batch_id }}-*
          merge-multiple: true
      - name: Build batch summary from result read-backs (reconciled)
        env:
          BATCH_ID: ${{ inputs.batch_id }}
          EXPECTED: ${{ needs.setup.outputs.count }}
        run: python3 tools/burst_batch_summary.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: burst-summary-${{ inputs.batch_id }}
          path: batch-summary.json
          if-no-files-found: error
          retention-days: 30
