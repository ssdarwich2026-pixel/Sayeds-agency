    provider: LiteLLM (open source)
    type: router
    license: MIT
    access: free-tier
    last_verified: 2026-10-06
    best_for: one OpenAI-style API in front of 100+ providers
    notes: The router backbone. See router/litellm-config.yaml.

  - name: openrouter
    provider: OpenRouter
    type: marketplace
    license: service
    access: freemium
    last_verified: 2026-10-06
